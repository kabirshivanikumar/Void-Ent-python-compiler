<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VOID // Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0f19; --panel:#10141f; --border:#1e2536; --cyan:#22d3ee; --emerald:#34d399; --text:#dbe3f0; --muted:#7c88a3; }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:'Space Grotesk', sans-serif; min-height:100vh; }
  .font-mono-custom{font-family:'Space Mono', monospace;}
  .glass{background:rgba(16,20,31,0.7); backdrop-filter:blur(10px); border:1px solid var(--border);}
  input, select{ background:#0d1220; border:1px solid var(--border); color:var(--text); }
  input:focus, select:focus{ outline:none; border-color:var(--cyan); }
  .btn-primary{ background:linear-gradient(90deg, rgba(34,211,238,0.15), rgba(52,211,153,0.15)); border:1px solid rgba(34,211,238,0.4); transition:all .2s ease; }
  .btn-primary:hover{ box-shadow:0 0 20px rgba(34,211,238,0.25); border-color:var(--cyan); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .toggle{ width:40px; height:22px; border-radius:9999px; background:#1e2536; position:relative; cursor:pointer; transition:background .2s ease; flex-shrink:0; }
  .toggle.on{ background:rgba(34,211,238,0.5); }
  .toggle .dot{ width:16px; height:16px; border-radius:9999px; background:#dbe3f0; position:absolute; top:3px; left:3px; transition:left .2s ease; }
  .toggle.on .dot{ left:21px; background:#0b0f19; }
</style>
</head>
<body class="min-h-screen">

<div id="loginView" class="min-h-screen flex items-center justify-center p-5">
  <div class="glass rounded-2xl p-8 w-full max-w-sm">
    <div class="text-lg font-semibold text-white mb-1">VOID // Admin</div>
    <div class="text-xs text-[var(--muted)] mb-6 font-mono-custom">Enter the admin password to continue.</div>
    <input id="passwordInput" type="password" placeholder="Password" class="w-full rounded-lg px-3 py-2.5 text-sm mb-3" />
    <button id="loginBtn" class="btn-primary w-full rounded-lg px-4 py-2.5 text-sm font-medium text-cyan-200">Sign in</button>
    <div id="loginError" class="text-xs text-rose-400 mt-3 hidden font-mono-custom"></div>
  </div>
</div>

<div id="dashView" class="hidden max-w-2xl mx-auto p-5 sm:p-8">
  <header class="mb-6 flex items-center justify-between">
    <div>
      <div class="text-2xl font-bold text-white tracking-tight">Site Settings</div>
      <div class="text-sm text-[var(--muted)] mt-1">Changes apply live on the main site.</div>
    </div>
    <button id="logoutBtn" class="text-xs text-[var(--muted)] hover:text-cyan-300 font-mono-custom">Sign out</button>
  </header>

  <div id="saveMsg" class="hidden text-xs font-mono-custom rounded-lg px-3 py-2 mb-4"></div>

  <section class="glass rounded-2xl p-5 mb-5">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-sm font-medium text-white">AI Assistant</div>
        <div class="text-xs text-[var(--muted)] mt-1 font-mono-custom">Model is fixed to meta-llama/llama-3.1-8b-instruct in the code.</div>
      </div>
      <div id="toggleAiEnabled" class="toggle"><div class="dot"></div></div>
    </div>
  </section>

  <section class="glass rounded-2xl p-5 mb-5">
    <div class="flex items-center justify-between mb-4">
      <div class="text-sm font-medium text-white">Sidebar Sponsor Card</div>
      <div id="toggleSponsorSidebar" class="toggle"><div class="dot"></div></div>
    </div>
    <div class="space-y-2">
      <input id="sponsorSidebarTitle" placeholder="Title" class="w-full rounded-lg px-3 py-2 text-sm" />
      <input id="sponsorSidebarDesc" placeholder="Description" class="w-full rounded-lg px-3 py-2 text-sm" />
      <input id="sponsorSidebarLinkText" placeholder="Link text (e.g. Learn more →)" class="w-full rounded-lg px-3 py-2 text-sm" />
      <input id="sponsorSidebarLinkUrl" placeholder="Link URL" class="w-full rounded-lg px-3 py-2 text-sm" />
    </div>
  </section>

  <section class="glass rounded-2xl p-5 mb-5">
    <div class="flex items-center justify-between mb-4">
      <div class="text-sm font-medium text-white">Bottom Sponsor Bar</div>
      <div id="toggleSponsorBottom" class="toggle"><div class="dot"></div></div>
    </div>
    <div class="space-y-2">
      <input id="sponsorBottomTitle" placeholder="Title" class="w-full rounded-lg px-3 py-2 text-sm" />
      <input id="sponsorBottomLinkText" placeholder="Link text (e.g. Explore →)" class="w-full rounded-lg px-3 py-2 text-sm" />
      <input id="sponsorBottomLinkUrl" placeholder="Link URL" class="w-full rounded-lg px-3 py-2 text-sm" />
    </div>
  </section>

  <button id="saveBtn" class="btn-primary rounded-lg px-5 py-2.5 text-sm font-medium text-cyan-200">Save changes</button>
</div>

<script>
let adminPassword = '';

const loginView = document.getElementById('loginView');
const dashView = document.getElementById('dashView');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

function setToggle(el, on){ el.classList.toggle('on', !!on); el.dataset.on = on ? '1' : '0'; }
function getToggle(el){ return el.dataset.on === '1'; }
[document.getElementById('toggleAiEnabled'),
 document.getElementById('toggleSponsorSidebar'),
 document.getElementById('toggleSponsorBottom')].forEach(el=>{
  el.addEventListener('click', ()=> setToggle(el, !getToggle(el)));
});

async function attemptLogin(){
  const password = passwordInput.value;
  loginError.classList.add('hidden');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Checking…';
  try{
    const res = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      adminPassword = password;
      sessionStorage.setItem('void_admin_pw', password);
      await enterDashboard();
    } else {
      loginError.textContent = data.error || 'Incorrect password.';
      loginError.classList.remove('hidden');
    }
  }catch(e){
    loginError.textContent = 'Network error — please try again.';
    loginError.classList.remove('hidden');
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  }
}
loginBtn.addEventListener('click', attemptLogin);
passwordInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  adminPassword = '';
  sessionStorage.removeItem('void_admin_pw');
  dashView.classList.add('hidden');
  loginView.classList.remove('hidden');
  passwordInput.value = '';
});

async function enterDashboard(){
  loginView.classList.add('hidden');
  dashView.classList.remove('hidden');

  const res = await fetch('/api/settings');
  const s = await res.json();

  setToggle(document.getElementById('toggleAiEnabled'), s.aiGeneratorEnabled !== false);

  const sb = s.sponsorSidebar || {};
  setToggle(document.getElementById('toggleSponsorSidebar'), !!sb.enabled);
  document.getElementById('sponsorSidebarTitle').value = sb.title || '';
  document.getElementById('sponsorSidebarDesc').value = sb.description || '';
  document.getElementById('sponsorSidebarLinkText').value = sb.linkText || '';
  document.getElementById('sponsorSidebarLinkUrl').value = sb.linkUrl || '';

  const bb = s.sponsorBottom || {};
  setToggle(document.getElementById('toggleSponsorBottom'), !!bb.enabled);
  document.getElementById('sponsorBottomTitle').value = bb.title || '';
  document.getElementById('sponsorBottomLinkText').value = bb.linkText || '';
  document.getElementById('sponsorBottomLinkUrl').value = bb.linkUrl || '';
}

function showSaveMsg(text, ok){
  const el = document.getElementById('saveMsg');
  el.textContent = text;
  el.classList.remove('hidden');
  el.style.color = ok ? '#34d399' : '#fb7185';
  el.style.border = '1px solid ' + (ok ? 'rgba(52,211,153,0.35)' : 'rgba(251,113,133,0.35)');
  setTimeout(()=> el.classList.add('hidden'), 4000);
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const settings = {
    aiGeneratorEnabled: getToggle(document.getElementById('toggleAiEnabled')),
    sponsorSidebar: {
      enabled: getToggle(document.getElementById('toggleSponsorSidebar')),
      title: document.getElementById('sponsorSidebarTitle').value,
      description: document.getElementById('sponsorSidebarDesc').value,
      linkText: document.getElementById('sponsorSidebarLinkText').value,
      linkUrl: document.getElementById('sponsorSidebarLinkUrl').value
    },
    sponsorBottom: {
      enabled: getToggle(document.getElementById('toggleSponsorBottom')),
      title: document.getElementById('sponsorBottomTitle').value,
      linkText: document.getElementById('sponsorBottomLinkText').value,
      linkUrl: document.getElementById('sponsorBottomLinkUrl').value
    }
  };

  try{
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify(settings)
    });
    const data = await res.json();
    if(res.ok){
      showSaveMsg('Saved.', true);
    } else {
      showSaveMsg(data.error || 'Save failed.', false);
    }
  }catch(e){
    showSaveMsg('Network error — save failed.', false);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Save changes';
  }
});

(function tryResume(){
  const saved = sessionStorage.getItem('void_admin_pw');
  if(saved){
    passwordInput.value = saved;
    attemptLogin();
  }
})();
</script>
</body>
</html>
